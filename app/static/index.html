<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisa · Agent Demo</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --line: #e6e8ec; --ink: #1f2430; --muted: #6b7280; --faint: #9aa1ad;
  --accent: #2f6fd6; --accent-soft: #eaf1fc; --grey: #b9bec7; --grey-dark: #6b7280;
  --read: #e7f5ee; --read-ink: #0f6b45; --skip: #f1f2f4; --live: #fff6db; --card: #fbfcff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; }
header { height: 56px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-weight: 650; }
.who { color: var(--muted); }
.spacer { flex: 1; }
.stops { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stops button { border: 0; background: var(--panel); padding: 7px 12px; cursor: pointer; color: var(--muted); font: inherit; border-right: 1px solid var(--line); }
.stops button:last-child { border-right: 0; }
.stops button.on { background: var(--accent); color: #fff; font-weight: 600; }
.switch { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.switch input { display: none; }
.switch .track { width: 36px; height: 20px; border-radius: 10px; background: #cfd3da; position: relative; transition: background .15s; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { left: 18px; }
button.primary { border: 0; border-radius: 8px; padding: 8px 12px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; font: inherit; }
button.primary:disabled { opacity: .45; cursor: default; }
.pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
main { flex: 1; display: grid; grid-template-columns: 330px minmax(420px, 1fr) 460px; min-height: 0; }
section { min-height: 0; overflow-y: auto; }
.list { background: var(--panel); border-right: 1px solid var(--line); }
.filters { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 12px; display: none; gap: 6px; flex-wrap: wrap; z-index: 1; }
.agent .filters { display: flex; }
.chipbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
.chipbtn.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
.item { display: grid; grid-template-columns: 32px 1fr; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:hover { background: #fafbfc; }
.item.sel { background: var(--accent-soft); }
.item.new { background: var(--live); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 650; font-size: 13px; }
.row1 { display: flex; gap: 8px; align-items: baseline; }
.from, .subj, .snip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.from { flex: 1; }
.unread .from, .unread .subj { font-weight: 650; }
.when { color: var(--faint); font-size: 12px; }
.snip { color: var(--muted); font-size: 12.5px; }
.tag { display: none; margin-top: 5px; font-size: 11.5px; border-radius: 6px; padding: 2px 7px; width: fit-content; }
.agent .tag { display: block; }
.tag.sent_to_claude { background: var(--accent-soft); color: #1f4f9e; }
.tag.on_device_event { background: var(--read); color: var(--read-ink); }
.tag.on_device_personal, .tag.on_device_guard, .tag.not_shared { background: var(--skip); color: var(--muted); }
.tag.on_device_nothing { background: #f7f7f8; color: var(--faint); }
.sharebar { display: none; padding: 10px 12px; border-bottom: 1px solid var(--line); background: #f5faf7; font-size: 12.5px; }
.mode-filtered .sharebar { display: block; }
.sourcesbar { display: none; padding: 10px 12px; border-bottom: 1px solid var(--line); background: #f7f9fd; font-size: 12.5px; }
.mode-full .sourcesbar { display: block; }
.sourcesbar .src { display: grid; grid-template-columns: 16px 1fr; gap: 4px 6px; margin: 3px 0; }
.sourcesbar .src.off { color: var(--faint); }
.receipts { display: none; padding: 14px 14px 20px; }
.mode-manual .receipts { display: block; }
.mode-manual .item, .mode-manual .filters { display: none !important; }
.receipts .rh { font-weight: 650; font-size: 15px; }
.receipts .rsub { color: var(--muted); font-size: 12.5px; margin: 4px 0 10px; }
.receipts .upl { display: inline-block; cursor: pointer; background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 12px; font-weight: 600; }
.samples { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.samples img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid var(--line); }
.samples img:hover { outline: 2px solid var(--accent); }
.rlist { margin: 14px 0 10px; }
.ritem { position: relative; border: 1px solid var(--line); border-radius: 8px; padding: 8px 30px 8px 10px; margin-bottom: 6px; font-size: 13px; }
.ritem span { color: var(--muted); font-size: 12px; }
.rdel { position: absolute; right: 6px; top: 6px; border: 0; background: none; color: var(--faint); font-size: 16px; cursor: pointer; }
.sharebar .sbh { font-weight: 650; color: var(--read-ink); margin-bottom: 6px; }
.sharebar label { display: inline-flex; align-items: center; gap: 4px; margin: 2px 10px 2px 0; cursor: pointer; }
.lm { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.mid { padding: 16px 18px 40px; }
h2.sec { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 4px 0 8px; }
.timeline { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 6px; margin-bottom: 16px; }
.timeline svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; padding: 2px 2px 4px; }
.card { background: var(--card); border: 1px solid #d9e3f5; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.card .kind { font-size: 12px; color: var(--accent); font-weight: 650; text-transform: uppercase; letter-spacing: .5px; }
.card h3 { margin: 4px 0 6px; font-size: 17px; }
.card .body { margin: 0 0 10px; }
.card .meta { color: var(--faint); font-size: 12px; }
.why-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 12.5px; }
table.why { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12.5px; }
table.why th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); padding: 5px 6px; }
table.why td { border-bottom: 1px solid #f0f1f4; padding: 5px 6px; vertical-align: top; }
table.why tr.link { cursor: pointer; }
table.why tr.link:hover td { background: var(--accent-soft); }
.yes { color: var(--accent); font-weight: 650; }
.history { color: var(--muted); font-size: 13px; }
.history div { padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.waiting { color: var(--muted); border: 1px dashed var(--grey); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.reader { background: var(--panel); border-left: 1px solid var(--line); padding: 16px 18px 40px; }
.reader h1 { font-size: 18px; margin: 0 0 4px; }
.reader .meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.agentbox { display: none; border: 1px solid #d9e3f5; background: var(--card); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
.agent .agentbox, .agentbox.always { display: block; }
.agentbox .head { font-weight: 650; color: var(--accent); margin-bottom: 4px; }
.agentbox td { padding: 1px 12px 1px 0; vertical-align: top; }
.agentbox td:first-child { color: var(--muted); }
iframe { width: 100%; border: 0; min-height: 520px; background: #f4f4f5; border-radius: 8px; }
pre.plain { white-space: pre-wrap; font: inherit; background: var(--bg); border-radius: 8px; padding: 14px; }
.brief h2 { font-size: 17px; margin: 0 0 6px; }
.brief h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--accent); margin: 14px 0 4px; }
.brief ul { margin: 0; padding-left: 18px; }
.brief p { margin: 0 0 8px; color: var(--muted); }
.empty { color: var(--faint); margin-top: 30vh; text-align: center; }
button.ghost { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px; cursor: pointer; font: inherit; }
header { gap: 10px; }
.stops button, button.primary, button.ghost, .switch span { white-space: nowrap; }
@media (max-width: 1500px) {
  .who { display: none; }
  .stops button { padding: 7px 9px; }
  .pill { max-width: 270px; overflow: hidden; text-overflow: ellipsis; }
}
.phone { position: fixed; right: 18px; bottom: 18px; width: 290px; height: 560px; border-radius: 42px; background: #0b0d12; padding: 11px; box-shadow: 0 24px 60px rgba(15, 20, 30, .35); z-index: 20; }
.nophone .phone { display: none; }
.screen { position: relative; height: 100%; border-radius: 32px; overflow: hidden; padding: 44px 11px 12px; color: #fff;
  background: radial-gradient(120% 80% at 20% 0%, #5d6f96 0%, #2a3550 55%, #161b29 100%); }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 92px; height: 26px; border-radius: 14px; background: #000; }
.lock-date { text-align: center; font-size: 14px; opacity: .85; }
.lock-time { text-align: center; font-size: 58px; font-weight: 250; line-height: 1.05; margin-bottom: 14px; letter-spacing: -1px; }
#notifs { display: flex; flex-direction: column; gap: 8px; }
.notif { background: rgba(245, 246, 250, .86); color: #14171f; border-radius: 18px; padding: 10px 12px; cursor: pointer; animation: slidein .35s ease-out both; }
.notif:nth-child(2) { animation-delay: .25s; } .notif:nth-child(3) { animation-delay: .5s; }
@keyframes slidein { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
.notif .app { display: flex; justify-content: space-between; font-size: 11px; color: #5b6170; margin-bottom: 2px; }
.notif .t { font-weight: 650; font-size: 13.5px; line-height: 1.3; }
.notif .b { font-size: 12.5px; line-height: 1.35; color: #2b303b; }
.notif .actions { display: flex; gap: 6px; margin-top: 8px; }
.notif .actions button { flex: 1; border: 0; border-radius: 10px; padding: 6px 0; background: rgba(0, 0, 0, .07); font: inherit; font-weight: 650; font-size: 13px; color: #14171f; cursor: pointer; }
.notif .actions button.chosen { background: var(--accent); color: #fff; }
.notif .answered { font-size: 11px; color: #5b6170; margin-top: 5px; }
.quiet { text-align: center; font-size: 12.5px; opacity: .75; margin-top: 20px; }
.flash { animation: flash 1.2s ease-out; }
.caption { position: fixed; left: calc(50% - 170px); bottom: 26px; transform: translate(-50%, 10px); width: min(640px, 52vw); z-index: 30; pointer-events: none;
  background: rgba(17, 20, 28, .88); color: #fff; border-radius: 14px; padding: 14px 18px; font-size: 18px; line-height: 1.4; opacity: 0; transition: opacity .35s, transform .35s; }
.caption.on { opacity: 1; transform: translate(-50%, 0); }
.caption .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .8px; color: #a9c2ff; margin-bottom: 4px; }
.nocaptions .caption { display: none; }
@keyframes flash { 0% { box-shadow: 0 0 0 4px rgba(47, 111, 214, .45); } 100% { box-shadow: 0 0 0 0 rgba(47, 111, 214, 0); } }
</style>
</head>
<body>
<header>
  <div class="brand">Mail</div>
  <div class="who">lisa.hartley@mail.example</div>
  <div class="spacer"></div>
  <div class="stops" id="stops"></div>
  <div class="stops" id="modes" title="Manual: only receipt photos you upload. Filtered: an on-device model decides what Claude may read. Full: every source, personal mail still skipped."><button data-m="manual">Manual</button><button data-m="filtered">Filtered</button><button data-m="full">Full</button></div>
  <label class="switch"><input type="checkbox" id="agentToggle"><span class="track"></span><span>Agent view</span></label>
  <button class="ghost" id="playBtn" title="Play the whole story with captions (P). C hides captions.">▶ Play story</button>
  <button class="primary" id="liveBtn">▶ New email</button>
  <button class="ghost" id="phoneBtn" title="Show or hide the phone">Phone</button>
  <span class="pill" id="statusPill">…</span>
</header>
<main>
  <section class="list" id="list"><div class="receipts" id="receipts"></div><div class="sharebar" id="sharebar"></div><div class="sourcesbar" id="sourcesbar"></div><div class="filters" id="filters"></div></section>
  <section class="mid" id="mid"></section>
  <section class="reader" id="reader"><div class="empty">Select an email</div></section>
</main>
<div class="caption" id="caption" aria-live="polite"></div>
<div class="phone" aria-label="Lisa's phone"><div class="screen"><div class="island"></div>
  <div class="lock-date" id="lockDate"></div><div class="lock-time" id="lockTime"></div><div id="notifs"></div></div></div>
<script>
const S = { emails: [], nights: [], stops: {}, asOf: "2026-08-13", filter: "all", selected: null, ins: null, briefing: false };
const COLORS = ["#5b4b8a", "#0f766e", "#b45309", "#1d4ed8", "#9d174d", "#15803d", "#7f1d1d", "#334155", "#a16207", "#0369a1"];
const KIND = { awareness: "Noticed a change", trigger: "Possible trigger", question: "One question", change: "Did it help?", brief: "Visit summary" };
const WAKE_TIME = "07:35";   // cards go out after she is up, not overnight
const LABELS = {
  restaurant_reservation: "Restaurant reservation", restaurant_receipt: "Restaurant receipt", alcohol_purchase: "Alcohol purchase",
  grocery_order: "Grocery order", symptom_relief_purchase: "Bought for nights", other_purchase: "Other purchase",
  pharmacy_rx_ready: "Prescription ready", pharmacy_rx_pickup: "Prescription picked up", pharmacy_refill_reminder: "Refill reminder",
  medical_appointment: "Medical appointment", appointment_reminder: "Appointment reminder", medical_portal_notice: "Portal notice",
  exercise_booking: "Exercise booking", travel_booking: "Flight booking", hotel_booking: "Hotel booking", travel_checkin: "Flight check-in",
};
const EVIDENCE = { confirmed_yes: "yes (her answer)", receipt_alcohol: "yes (receipt)", possible: "maybe", receipt_no_alcohol: "no (receipt)", confirmed_no: "no (her answer)", none: "" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
const api = async (path, opts) => { const r = await fetch(path, opts); if (!r.ok) throw new Error(path + " " + r.status); return r.json(); };
const agentOn = () => document.body.classList.contains("agent");

function colorFor(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
const LOCAL_LABEL = { personal: "personal", noise: "newsletter, bill or ad", restaurant: "restaurant", grocery_alcohol: "groceries & wine",
  sleep_purchase: "bought for sleep", other_purchase: "other shopping", pharmacy: "pharmacy", medical: "doctor's office", travel: "travel", exercise: "exercise booking" };
const STATES = [["all", "All"], ["sent_to_claude", "Sent to Claude"], ["on_device_event", "Shared as events"], ["not_shared", "Not shared"],
  ["on_device_personal", "Personal"], ["on_device_guard", "Might be personal"], ["on_device_nothing", "Nothing kept"]];
const pct = x => Math.round((x || 0) * 100);

function tagText(st) {
  const lab = LOCAL_LABEL[st.local?.label] || "";
  if (st.state === "on_device_personal") return "🔒 On device · personal, never sent";
  if (st.state === "on_device_guard") return `🔒 On device · might be personal (${pct(st.local?.p_personal)}%)`;
  if (st.state === "on_device_nothing") return `On device · ${lab}, nothing kept`;
  if (st.state === "not_shared") return `Not shared · ${lab} (your setting)`;
  const e = st.event || {};
  let t = (st.state === "on_device_event" ? "On device → shared event · " : "Sent to Claude · ") + (LABELS[e.category] || e.category || lab);
  if (e.alcohol_signal === "present") t += " · alcohol";
  if (e.alcohol_signal === "absent") t += " · no alcohol";
  return t;
}

// ------------------------------------------------------------- inbox
function renderList() {
  const f = $("filters");
  f.innerHTML = "";
  for (const [k, label] of STATES) {
    const n = k === "all" ? S.emails.length : S.emails.filter(m => m.status.state === k).length;
    if (!n && k !== "all") continue;
    const b = document.createElement("button");
    b.className = "chipbtn" + (S.filter === k ? " on" : "");
    b.textContent = `${label} ${n}`;
    b.onclick = () => { S.filter = k; renderList(); };
    f.appendChild(b);
  }
  $("list").querySelectorAll(".item").forEach(n => n.remove());
  for (const m of S.emails) {
    if (S.filter !== "all" && m.status.state !== S.filter) continue;
    const el = document.createElement("div");
    el.className = "item" + (m.is_read ? "" : " unread") + (S.selected === m.id ? " sel" : "") + (m.id === "msg_live" ? " new" : "");
    el.innerHTML = `<div class="avatar" style="background:${colorFor(m.from.name)}">${esc(m.from.name[0])}</div>
      <div style="min-width:0"><div class="row1"><div class="from">${esc(m.from.name)}</div><div class="when">${md(m.date.slice(0, 10))}</div></div>
      <div class="subj">${esc(m.subject)}</div><div class="snip">${esc(m.snippet)}</div><div class="tag ${m.status.state}">${esc(tagText(m.status))}</div></div>`;
    el.onclick = () => openEmail(m.id);
    $("list").appendChild(el);
  }
}

async function openEmail(id) {
  S.selected = id;
  S.briefing = false;
  const m = await api(`/api/emails/${id}`);
  const row = S.emails.find(x => x.id === id);
  if (row) row.is_read = true;
  renderList();
  const r = $("reader");
  r.innerHTML = `<h1>${esc(m.subject)}</h1><div class="meta">${esc(m.from.name)} &lt;${esc(m.from.email)}&gt; · ${esc(new Date(m.date).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short", timeZone: "America/Los_Angeles" }))}</div>`;
  r.appendChild(agentBox(m.status, m.extracted_by));
  if (m.body_html) {
    const f = document.createElement("iframe");
    f.setAttribute("sandbox", "allow-same-origin");
    f.srcdoc = m.body_html;
    f.onload = () => { try { f.style.height = f.contentDocument.body.scrollHeight + 30 + "px"; } catch (e) {} };
    r.appendChild(f);
  } else {
    const pre = document.createElement("pre"); pre.className = "plain"; pre.textContent = m.body_text; r.appendChild(pre);
  }
}

function eventRows(e) {
  return [["Type", LABELS[e.category] || e.category], ["When", [e.event_date, e.event_time].filter(Boolean).join(" ") + (e.end_date ? " → " + e.end_date : "")],
    ["Where", e.merchant], ["Items", (e.items || []).join(", ")], ["Alcohol", { present: "yes, on the receipt", absent: "no", unknown: "unknown (may ask one tap later)" }[e.alcohol_signal]],
    ["With", [e.provider, e.visit_type].filter(Boolean).join(" · ")]].filter(([, v]) => v);
}

function agentBox(st, by) {
  const box = document.createElement("div");
  box.className = "agentbox";
  const loc = st.local || {};
  const lm = loc.label ? `<div class="lm">On-device model (fastText): <b>${esc(LOCAL_LABEL[loc.label] || loc.label)}</b>${loc.confidence != null ? ` · ${pct(loc.confidence)}% sure` : ""}${loc.p_personal >= 0.05 && loc.label !== "personal" ? ` · personal ${pct(loc.p_personal)}%` : ""}${loc.ms != null ? ` · ${loc.ms} ms` : ""}</div>` : "";
  const quiet = {
    on_device_personal: ["Stayed on the device", "The on-device model reads this as person-to-person mail. It is never sent anywhere, in either mode."],
    on_device_guard: ["Stayed on the device", `Probably ${esc(LOCAL_LABEL[loc.label] || "")}, but the model gives it a ${pct(loc.p_personal)}% chance of being personal mail. Anything at 10% or more never leaves the device.`],
    on_device_nothing: ["Stayed on the device", "Nothing health-related here, so nothing was kept and nothing was sent."],
    not_shared: ["Not shared", "You switched this kind of email off in Private mode, so the agent ignores it."],
  }[st.state];
  if (quiet) { box.innerHTML = `<div class="head">${quiet[0]}</div>${lm}<div>${quiet[1]}</div>`; return box; }
  const rows = eventRows(st.event || {});
  const onDevice = st.state === "on_device_event";
  const head = onDevice ? "Extracted on this device · only this row was shared" : `Sent to Claude for extraction${by ? " · " + esc(by) : ""}`;
  const foot = onDevice ? "Claude never saw this email. The row above is all that left the device." : "Claude read this email to pull out the row above; only the row is stored.";
  box.innerHTML = `<div class="head">${head}</div>${lm}<table>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join("")}</table>
    <div style="color:var(--muted);margin-top:4px">${foot}</div>`;
  return box;
}

// ------------------------------------------------------------- timeline
function renderTimeline(host) {
  const N = S.nights, W = 900, H = 236, L = 44, R = 16, n = N.length;
  const x = i => L + i * (W - L - R) / (n - 1), idx = d => N.findIndex(r => r.evening === d);
  const vmin = -0.3, vmax = 1.0, y = v => 168 - (Math.max(vmin, Math.min(vmax, v)) - vmin) / (vmax - vmin) * 122;
  const asOfIdx = N.findIndex(r => r.evening >= S.asOf), cut = asOfIdx < 0 ? n : asOfIdx;
  const rx = S.ins.treatment_start;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Nightly temperature and hot wake-ups">`;
  for (const v of [0, 0.5, 1.0]) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f3"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#9aa1ad">${v > 0 ? "+" : ""}${v.toFixed(1)}</text>`;
  s += `<line x1="${L}" x2="${W - R}" y1="${y(0.3)}" y2="${y(0.3)}" stroke="#c9ced6" stroke-dasharray="3 4"/><text x="${W - R}" y="${y(0.3) - 4}" text-anchor="end" font-size="10.5" fill="#9aa1ad">+0.30 °C</text>`;
  N.forEach((r, i) => { if (r.evening.endsWith("-01")) s += `<text x="${x(i)}" y="${H - 8}" font-size="11" fill="#9aa1ad">${md(r.evening).split(" ")[0]}</text><line x1="${x(i)}" x2="${x(i)}" y1="${H - 22}" y2="${H - 18}" stroke="#c9ced6"/>`; });
  if (rx && idx(rx) >= 0) s += `<line x1="${x(idx(rx))}" x2="${x(idx(rx))}" y1="40" y2="200" stroke="#8b919c" stroke-dasharray="4 4"/><text x="${x(idx(rx)) + 5}" y="52" font-size="11" fill="#6b7280">New prescription ${md(rx)}</text>`;
  N.forEach((r, i) => {
    const tip = `${md(r.evening)}: ${r.temp_dev > 0 ? "+" : ""}${r.temp_dev} °C, longest wake ${r.longest_wake_min} min${r.why ? " · " + r.why : ""}`;
    s += r.night_heat ? `<circle cx="${x(i)}" cy="${y(r.temp_dev)}" r="4.5" fill="var(--accent)"><title>${esc(tip)}</title></circle>`
                      : `<circle cx="${x(i)}" cy="${y(r.temp_dev)}" r="2.6" fill="#b9bec7"><title>${esc(tip)}</title></circle>`;
    if (r.evidence === "receipt_alcohol" || r.evidence === "confirmed_yes") s += `<rect x="${x(i) - 3}" y="180" width="6" height="6" fill="#6b7280"><title>${esc(md(r.evening) + ": " + r.why)}</title></rect>`;
    else if (r.evidence === "possible") s += `<rect x="${x(i) - 2.5}" y="180.5" width="5" height="5" fill="none" stroke="#6b7280"><title>${esc(md(r.evening) + ": " + r.why)}</title></rect>`;
    if (r.tennis) s += `<circle cx="${x(i)}" cy="196" r="2.6" fill="none" stroke="#6b7280"><title>${md(r.evening)}: tennis</title></circle>`;
  });
  if (cut < n) s += `<rect x="${x(cut) - 3}" y="30" width="${W - R - x(cut) + 6}" height="${H - 40}" fill="#ffffff" opacity="0.78"/><line x1="${x(cut) - 3}" x2="${x(cut) - 3}" y1="30" y2="200" stroke="var(--accent)"/>`;
  for (const [d, kind] of Object.entries(S.stops)) {
    const i = Math.min(idx(d) < 0 ? n - 1 : idx(d), n - 1), on = d === S.asOf;
    s += `<path d="M${x(i)} 12l6 6l-6 6l-6 -6z" fill="${on ? "var(--accent)" : "#b9bec7"}"/><text x="${x(i) + (kind === "brief" ? -9 : 9)}" y="22" font-size="11" text-anchor="${kind === "brief" ? "end" : "start"}" fill="${on ? "#1f2430" : "#9aa1ad"}">${KIND[kind]}</text>`;
  }
  s += `</svg>`;
  host.innerHTML = `<div class="timeline">${s}<div class="legend"><span><b style="color:var(--accent)">●</b> hot wake-up (warm night + awake ≥15 min, 1:30–5 AM)</span><span>■ alcohol (receipt or her answer)</span><span>□ maybe (reservation, party, or a restaurant/bar visit)</span><span>○ tennis</span></div></div>`;
}

function whyTable(c) {
  if (c.kind === "awareness") return `<table class="why"><tr><th>Night</th><th>Temp</th><th>Longest wake</th></tr>${c.why.map(r => `<tr><td>${md(r.evening)}</td><td>+${r.temp_dev} °C</td><td>${r.longest_wake_min} min</td></tr>`).join("")}</table>`;
  if (c.kind === "trigger") {
    const n = c.numbers;
    return `<table class="why"><tr><th>Night</th><th>What the agent saw</th><th>Alcohol</th><th>Hot wake-up</th></tr>${c.why.map(r =>
      `<tr class="${r.email_id ? "link" : ""}" data-email="${r.email_id || ""}"><td>${md(r.evening)}</td><td>${esc(r.why || "no clue")}</td><td>${EVIDENCE[r.evidence] || ""}</td><td>${r.night_heat ? '<span class="yes">yes</span>' : "–"}</td></tr>`).join("")}</table>
      <div class="meta" style="margin-top:6px">Alcohol nights ${n.alcohol_nights_with_heat}/${n.alcohol_nights} vs other ${n.other_nights_with_heat}/${n.other_nights} (Fisher p = ${n.p_value}). Tennis ${n.tennis_nights_with_heat}/${n.tennis_nights}: no difference. “Maybe” nights are left out of both groups.</div>`;
  }
  const [b, a] = c.why;
  const row = (k, f) => `<tr><td>${k}</td><td>${f(b)}</td><td>${f(a)}</td></tr>`;
  return `<table class="why"><tr><th></th><th>Before (${md(b.from)}–${md(b.to)})</th><th>Latest 28 nights (${md(a.from)}–${md(a.to)})</th></tr>
    ${row("Hot wake-ups / week", r => r.heat_per_week)}${row("Evenings with alcohol / week", r => r.alcohol_likely_per_week)}${row("Avg time awake", r => r.avg_awake_min + " min")}${row("Travel nights", r => r.travel_nights)}</table>`;
}

const clock = hm => { const [h, m] = hm.split(":").map(Number); return `${h % 12 || 12}:${String(m).padStart(2, "0")}`; };
const plusMin = (hm, k) => { const [h, m] = hm.split(":").map(Number), t = h * 60 + m + k; return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; };
const firstSentence = s => s.split(/(?<=[.!?])\s/)[0];

function renderPhone() {
  const d = S.asOf, items = [];
  const qs = S.ins.confirmations.filter(a => a.asked_at.slice(0, 10) === d);
  for (const q of qs) items.push({ time: q.asked_at.slice(11, 16), kind: "question", q });
  const card = S.ins.cards.find(c => c.as_of === d);
  // The trigger card goes out right after the answer that completed the evidence; other cards once she is up
  if (card) items.push({ time: card.kind === "trigger" && qs.length ? plusMin(qs.at(-1).answered_at.slice(11, 16), 1) : WAKE_TIME, kind: "card", card });
  if (d === "2026-11-05" && S.briefing) items.push({ time: "08:13", kind: "summary" });
  items.sort((a, b) => a.time.localeCompare(b.time));
  $("lockDate").textContent = new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  $("lockTime").textContent = clock(items.length ? items.at(-1).time : WAKE_TIME);
  const box = $("notifs");
  box.innerHTML = items.length ? "" : '<div class="quiet">No notifications today.<br>The agent stays quiet.</div>';
  for (const it of items.reverse()) box.appendChild(notifEl(it));   // newest on top, like a lock screen
}

function notifEl(it) {
  const el = document.createElement("div");

// ------------------------------------------------------------- live email -> visit summary
function mdToHtml(src) {
  const out = []; let inList = false;
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  for (const line of src.split("\n")) {
    if (/^\s*[-*] /.test(line)) { if (!inList) { out.push("<ul>"); inList = true; } out.push(`<li>${inline(line.replace(/^\s*[-*] /, ""))}</li>`); continue; }
    if (inList) { out.push("</ul>"); inList = false; }
    if (line.startsWith("### ")) out.push(`<h3>${inline(line.slice(4))}</h3>`);
    else if (line.startsWith("## ")) out.push(`<h2>${inline(line.slice(3))}</h2>`);
    else if (line.startsWith("# ")) out.push(`<h2>${inline(line.slice(2))}</h2>`);
    else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (inList) out.push("</ul>");
  return out.join("");
}

async function liveEmail() {
  $("liveBtn").disabled = true;
  const res = await api("/api/live-email", { method: "POST" });
  const m = await api("/api/emails/msg_live");
  S.emails.unshift({ id: "msg_live", date: m.date, from: m.from, subject: m.subject, snippet: m.snippet, is_read: false, status: { state: res.state, local: res.local, event: res.event } });
  S.filter = "all";
  await setAsOf("2026-11-05");
  await openEmail("msg_live");
  S.briefDone = !res.triggers_brief;
  if (!res.triggers_brief) return;
  const r = $("reader");
  const box = document.createElement("div");
  box.className = "agentbox always";
  box.innerHTML = `<div class="head">Agent: appointment reminder → visit summary</div>Follow-up on ${md(res.event.event_date)}. Writing a summary for Lisa to review before her visit…`;
  r.prepend(box);
  const brief = document.createElement("div");
  brief.className = "card brief";
  r.insertBefore(brief, box.nextSibling);
  S.briefing = true; renderMid(); renderPhone();
  let text = "";
  const es = new EventSource("/api/brief/stream");
  es.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.text) { text += msg.text; brief.innerHTML = mdToHtml(text); }
    if (msg.done) { es.close(); S.briefDone = true; brief.insertAdjacentHTML("beforeend", `<div class="meta" style="margin-top:10px">Written by ${esc(msg.by)} · Lisa reviews it and decides whether to share it.</div>`); }
  };
  es.onerror = () => { es.close(); S.briefDone = true; };
}

// ------------------------------------------------------------- autoplay: the story, narrated by the agent
// ?autoplay=1 starts it on load; ?speed=1.5 makes every pause 1.5x longer. P plays or stops, C hides captions.
const SPEED = Number(new URLSearchParams(location.search).get("speed") || 1);
const STOP = Symbol("stop");
let playing = false, stopRequested = false;

async function pause(ms) {
  const end = Date.now() + ms * SPEED;
  while (Date.now() < end) {
    if (stopRequested) throw STOP;
    await new Promise(r => setTimeout(r, 100));
  }
}
async function waitFor(cond, maxMs) {
  const end = Date.now() + maxMs;
  while (!cond() && Date.now() < end) {
    if (stopRequested) throw STOP;
    await new Promise(r => setTimeout(r, 200));
  }
}
const dayN = d => Math.round((Date.parse(d) - Date.parse("2026-07-06")) / 864e5) + 1;
function caption(text, kicker) {
  const c = $("caption");
  c.classList.remove("on");
  void c.offsetWidth;
  c.innerHTML = (kicker ? `<div class="k">${esc(kicker)}</div>` : "") + `<div>${esc(text)}</div>`;
  c.classList.add("on");
}
async function say(text, ms, kicker) { caption(text, kicker); await pause(ms); }
function flashToday() {
  $("mid").scrollTo({ top: 0, behavior: "smooth" });
  const c = document.querySelector("#today .card");
  if (c) { c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash"); }
}
const cardOf = kind => S.ins.cards.find(c => c.kind === kind && c.as_of === S.asOf);

async function playStory() {
  if (playing) { stopRequested = true; return; }
  playing = true; stopRequested = false;
  $("playBtn").textContent = "■ Stop";
  try {
    await setMode("filtered");
    $("agentToggle").checked = true; document.body.classList.add("agent"); renderList();
    document.body.classList.remove("nophone");
    $("list").scrollTop = 0;
    await setAsOf("2026-08-13");
    await say("She has never logged a symptom. She wears a ring, and she gets email.", 4500, "Lisa, 46 · Oakland");

    const a = cardOf("awareness").numbers;
    flashToday();
    await say(`${a.heat_nights_last_14} warm wake-ups around 3 AM in two weeks. In the month before: ${a.baseline_heat_nights_first_28}. Time to say something. Once.`,
      7000, `Agent's diary · Day ${dayN("2026-08-13")}`);

    await setAsOf("2026-08-23");
    flashToday();
    await say("She tapped “Yes” on her lock screen. That was the missing piece.", 4500, `Agent's diary · Day ${dayN("2026-08-23")}`);
    const t = cardOf("trigger").numbers;
    document.querySelector("#today table.why")?.scrollIntoView({ behavior: "smooth", block: "center" });
    await say(`Drink nights: ${t.alcohol_nights_with_heat} of ${t.alcohol_nights} hot. Other nights: ${t.other_nights_with_heat} of ${t.other_nights}. Tennis nights: no difference.`,
      7000, `Agent's diary · Day ${dayN("2026-08-23")}`);

    await setAsOf("2026-09-04");
    await say("A new prescription. No drug name, and I won't guess. One question, then I wait 28 nights.", 6000, `Agent's diary · Day ${dayN("2026-09-04")}`);

    await setAsOf("2026-10-08");
    flashToday();
    const ch = cardOf("change").numbers;
    await say(`Hot wake-ups: ${ch.heat_per_week_before} → ${ch.heat_per_week_after} a week. But she drank less too, so I'm not taking credit yet.`,
      7000, `Agent's diary · Day ${dayN("2026-10-08")}`);

    caption("Her clinic just sent a reminder. Follow-up in five days.", `Agent's diary · Day ${dayN("2026-11-05")}`);
    await liveEmail();
    await pause(2600);
    document.body.classList.add("nophone");          // she opens the notification
    $("reader").scrollTo({ top: 0, behavior: "smooth" });
    await waitFor(() => S.briefDone, 45000);
    await pause(1500);
    const summary = $("reader").innerHTML;                // shown again behind the closing line
    await say("Three months on one page. Not “I just feel off.”", 5500, `Agent's diary · Day ${dayN("2026-11-05")}`);

    const sarah = S.emails.find(m => m.subject.startsWith("Girls' night"));
    if (sarah) await openEmail(sarah.id);
    await say("Sarah's email about girls' night? Not mine to read. It never left her phone.", 5500, "Privacy");

    await fetch("/api/receipts", { method: "DELETE" });
    await setMode("manual");
    document.body.classList.remove("nophone");
    const sample = document.querySelector(".samples img");
    if (sample) await uploadReceipt(await (await fetch(sample.dataset.url)).blob(), sample.dataset.name);
    await say("Prefer to choose? Snap a receipt. Location data is stripped before Claude reads it.", 6500, "Manual mode");

    await setMode("full");
    $("list").scrollTop = 0;
    await say("Or switch everything on. Only restaurant and bar visits, and restaurant, liquor-store and pharmacy charges, leave her phone. Never home, never the clinic.", 7500, "Full mode");

    await setMode("filtered");
    await setAsOf("2026-11-05");
    S.briefing = true; renderMid();
    document.body.classList.add("nophone");
    $("reader").innerHTML = summary;
    $("reader").scrollTop = 0;
    const asked = S.ins.confirmations.length, spoke = S.ins.cards.length + 1;
    await say(`Things Lisa logged: 0. Times I interrupted her: ${asked + spoke} in 17 weeks.`, 7000, "The agent's job is mostly staying quiet");
  } catch (e) {
    if (e !== STOP) console.error(e);
  } finally {
    playing = false; stopRequested = false;
    $("playBtn").textContent = "▶ Play story";
    $("caption").classList.remove("on");
  }
}

    <div class="rlist">${r.receipts.length ? "" : '<div class="rsub">Nothing shared yet.</div>'}${r.receipts.map(row => {
      const e = row.event;
      return `<div class="ritem" data-id="${row.id}"><b>${esc(e.merchant || LABELS[e.category] || "Receipt")}</b> · ${e.event_date ? md(e.event_date) : ""}<br>
        <span>${esc(LABELS[e.category] || e.category)}${e.alcohol_signal === "present" ? " · alcohol" : e.alcohol_signal === "absent" ? " · no alcohol" : ""}</span><button class="rdel" title="Delete">×</button></div>`;
    }).join("")}</div>${r.receipts.length ? '<button class="ghost" id="rclear">Clear all</button>' : ""}`;
  $("rfile").onchange = e => { const f = e.target.files[0]; if (f) uploadReceipt(f, f.name); };
  box.querySelectorAll(".samples img").forEach(img => img.onclick = async () => uploadReceipt(await (await fetch(img.dataset.url)).blob(), img.dataset.name));
  box.querySelectorAll(".rdel").forEach(b => b.onclick = async () => { await fetch(`/api/receipts/${b.parentElement.dataset.id}`, { method: "DELETE" }); await afterReceipts(); });
  if ($("rclear")) $("rclear").onclick = async () => { await fetch("/api/receipts", { method: "DELETE" }); await afterReceipts(); };
}

async function afterReceipts() { applyStatus(await api("/api/status")); await renderReceipts(); await setAsOf(S.asOf); }

async function uploadReceipt(blob, name) {
  const src = URL.createObjectURL(blob);
  showPhoto(src, name, null);
  const dataUrl = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
  const resp = await fetch("/api/receipts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ filename: name, data_url: dataUrl }) });
  const row = await resp.json();
  showPhoto(src, name, resp.ok ? row : { error: row.detail || "Upload failed" });
  if (resp.ok) await afterReceipts();
}

function showPhoto(src, name, row) {
  const r = $("reader");
  r.innerHTML = `<h1>${esc(name)}</h1><div class="meta">A receipt photo you chose to share</div>`;
  const box = document.createElement("div");
  box.className = "agentbox always";
  if (!row) box.innerHTML = `<div class="head">Reading…</div>Removing location and camera data, then sending only the pixels to Claude.`;
  else if (row.error) box.innerHTML = `<div class="head">Couldn't read this photo</div>${esc(row.error)}`;
  else {
    const p = row.privacy;
    box.innerHTML = `<div class="head">Read by ${esc(row.extracted_by)} · only this row is kept</div>
      <table>${eventRows(row.event).map(([k, v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join("")}</table>
      <div class="lm" style="margin-top:6px">Removed before sending: ${p.metadata_tags_removed} metadata tags${p.had_location ? ", including the GPS location" : ""}. The photo is not stored.</div>`;
  }
  r.appendChild(box);
  const img = document.createElement("img");
  img.src = src; img.alt = name; img.style.cssText = "width:100%;border-radius:8px;margin-top:4px";
  r.appendChild(img);
}

async function init() {
  const st = await api("/api/status");
  applyStatus(st);
  document.querySelectorAll("#modes button").forEach(b => b.onclick = () => setMode(b.dataset.m));
  $("stops").innerHTML = Object.keys(S.stops).map(d => `<button data-d="${d}">${md(d)}</button>`).join("");
  document.querySelectorAll("#stops button").forEach(b => b.onclick = () => setAsOf(b.dataset.d));
  $("agentToggle").onchange = e => { document.body.classList.toggle("agent", e.target.checked); renderList(); };
  $("liveBtn").onclick = liveEmail;
  $("phoneBtn").onclick = () => document.body.classList.toggle("nophone");
  $("playBtn").onclick = playStory;
  document.addEventListener("keydown", e => {
    if (e.target.matches("input, textarea")) return;
    if (e.key === "p" || e.key === "P") playStory();
    if (e.key === "c" || e.key === "C") document.body.classList.toggle("nocaptions");
  });
  [S.emails, S.nights] = await Promise.all([api("/api/emails"), api("/api/nights")]);
  renderList();
  if (st.mode === "manual") await renderReceipts();
  await setAsOf(S.asOf);
  if (new URLSearchParams(location.search).get("autoplay")) playStory();
}
init();
</script>
</body>
</html>
